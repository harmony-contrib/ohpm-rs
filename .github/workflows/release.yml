name: Release-plz

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-plz-release:
    name: Release-plz release
    if: ${{ github.repository == 'harmony-contrib/ohpm-rs' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    outputs:
      cli_tag: ${{ steps.cli-release.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Run release-plz release
        id: release
        uses: release-plz/action@v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Read CLI release tag
        id: cli-release
        env:
          RELEASES: ${{ steps.release.outputs.releases }}
        run: |
          tag=$(jq -r '[.[] | select(.package_name == "ohpm-cli")][0].tag // empty' <<< "$RELEASES")
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  build-binaries:
    name: Build binary (${{ matrix.target }})
    needs: release-plz-release
    if: ${{ needs.release-plz-release.outputs.cli_tag != '' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-15
            target: aarch64-apple-darwin
          - os: windows-2022
            target: x86_64-pc-windows-msvc
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
    defaults:
      run:
        shell: bash
    env:
      RELEASE_TAG: ${{ needs.release-plz-release.outputs.cli_tag }}
      TARGET: ${{ matrix.target }}
    steps:
      - name: Checkout released source
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Build release CLI
        run: cargo build --release --package ohpm-cli --bin ohpm-rs --target "$TARGET" --locked

      - name: Package and smoke-test binary
        run: |
          binary=ohpm-rs
          if [[ "$TARGET" == *-windows-* ]]; then
            binary+=.exe
          fi
          mkdir -p dist package smoke
          cp "target/$TARGET/release/$binary" package/
          cp crates/ohpm-cli/LICENSE package/
          cp README.md package/
          archive="dist/$RELEASE_TAG-$TARGET.tar.gz"
          tar -czf "$archive" -C package "$binary" LICENSE README.md
          tar -xzf "$archive" -C smoke
          test "$("./smoke/$binary" --version)" = "ohpm-rs ${RELEASE_TAG#ohpm-cli-v}"
          "./smoke/$binary" --help

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error
          compression-level: 0

  publish-binaries:
    name: Publish binaries
    needs: [release-plz-release, build-binaries]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.release-plz-release.outputs.cli_tag }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Download binary artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          path: dist
          merge-multiple: true

      - name: Generate checksums
        working-directory: dist
        run: sha256sum *.tar.gz > SHA256SUMS

      - name: Upload GitHub Release assets
        run: |
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY"
          gh release upload "$RELEASE_TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@v1.26.2

      - name: Verify installation from published binaries
        run: |
          cargo binstall ohpm-cli --version "=${RELEASE_TAG#ohpm-cli-v}" \
            --strategies crate-meta-data --no-confirm \
            --install-path "$RUNNER_TEMP/binstall-smoke"
          test "$("$RUNNER_TEMP/binstall-smoke/ohpm-rs" --version)" = "ohpm-rs ${RELEASE_TAG#ohpm-cli-v}"

  release-plz-pr:
    name: Release-plz PR
    if: ${{ github.repository == 'harmony-contrib/ohpm-rs' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    needs: release-plz-release
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Run release-plz release-pr
        uses: release-plz/action@v0.5
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
