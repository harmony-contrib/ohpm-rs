[package]
name = "ohpm-cli"
version.workspace = true
edition.workspace = true
license-file = "LICENSE"
repository.workspace = true
readme = "README.md"
keywords = ["openharmony", "harmonyos", "ohpm", "cli", "publish"]
categories = ["command-line-utilities"]
description = "ohpm (OpenHarmony package manager) CLI reimplemented in Rust"

[[bin]]
name = "ohpm-rs"
path = "src/main.rs"

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/{ name }-v{ version }/{ name }-v{ version }-{ target }.tar.gz"
pkg-fmt = "tgz"
bin-dir = "{ bin }{ binary-ext }"

[dependencies]
ohpm-core.workspace = true
clap.workspace = true
anyhow.workspace = true
tokio.workspace = true
serde_json.workspace = true
json5.workspace = true
log.workspace = true
dirs.workspace = true
dialoguer.workspace = true
flate2.workspace = true

[dev-dependencies]
tempfile.workspace = true
