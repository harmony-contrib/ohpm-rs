[workspace]
resolver = "2"
members = ["crates/ohpm-core", "crates/ohpm-cli"]

[workspace.package]
version = "0.2.0"
edition = "2021"
# `UNLICENSED` is not a valid SPDX expression and crates.io rejects it; each
# crate declares `license-file` (inside its own package dir) instead.
repository = "https://github.com/harmony-contrib/ohpm-rs"

[workspace.dependencies]
ohpm-core = { version = "0.2.0", path = "crates/ohpm-core" }
serde = { version = "1", features = ["derive"] }
# preserve_order: the reference rewrites manifests/lockfiles with
# insertion-ordered maps (`JSON.stringify` of parsed JSON5 objects).
serde_json = { version = "1", features = ["preserve_order"] }
json5 = "0.4"
thiserror = "2"
anyhow = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "time", "sync"] }
node-semver = "2"
# Pure-Rust git operations for git-spec dependencies (blocking client +
# reqwest HTTP transport; no system git, no libcurl).
gix = { version = "0.86", default-features = false, features = [
    "blocking-network-client",
    "blocking-http-transport-reqwest",
    "credentials",
    "revision",
    "index",
    "sha1",
    "sha256",
] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "multipart", "stream", "http2"] }
tar = "0.4"
flate2 = "1"
sha1 = "0.10"
sha2 = "0.10"
base64 = "0.22"
filetime = "0.2"
rsa = { version = "0.9", features = ["sha2", "pem", "pkcs5", "std"] }
pkcs1 = "0.7"
rand = "0.8"
uuid = { version = "1", features = ["v4"] }
regex = "1"
url = "2"
log = "0.4"
dirs = "5"
clap = { version = "4", features = ["derive"] }
glob = "0.3"
# Traditional (OpenSSL legacy) encrypted PEM key support
md-5 = "0.10"
aes = "0.8"
des = "0.8"
cbc = "0.1"
axum = "0.7"
tower = "0.5"
tempfile = "3"
